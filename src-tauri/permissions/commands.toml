  "hardware_info", "llm_status", "model_pull", "files_add_folder", "files_request_full_access",
  "files_activate_full_access", "files_remove_folder", "files_reindex", "files_index_status",
  "files_search", "search_memory", "knowledge_stats", "knowledge_file_groups", "list_knowledge",
  "forget_item", "get_person_context", "people_list", "people_os_preview", "people_add",
  "unknowns_pending", "unknown_label", "unknown_ignore", "add_fact", "rules_add", "rules_edit",
  "rules_delete", "rules_list", "rules_set_priority", "list_surfacings", "dismiss_surfacing",
  "list_triggers", "trigger_toggle", "system_snapshot", "access_log_list", "calendar_today",
