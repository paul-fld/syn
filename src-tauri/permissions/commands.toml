commands.allow = [
  "app_status", "setup_master", "unlock", "unlock_with_keychain", "unlock_with_recovery",
  "lock", "change_master_password", "regenerate_recovery", "set_keychain", "query",
  "list_sessions", "get_conversation", "rename_session", "delete_session", "list_projects",
  "create_project", "move_session_to_project", "get_startup_brief", "get_daily_wrap",
  "list_pending_actions", "list_actions", "confirm_action", "reject_action", "undo_action",
  "connector_status", "native_permissions", "request_native_permission", "open_native_settings",
